<style>
/* Splash d'avvio: logo + frase mentre l'app carica, poi sfuma. Inline nell'<head> così appare subito, senza flash. */
#splash{position:fixed;inset:0;z-index:99999;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;background:#111114;color:#e6ebf5;font-family:-apple-system,"Segoe UI",system-ui,Arial,sans-serif;padding:24px;box-sizing:border-box;transition:opacity .5s ease}
#splash.hide{opacity:0;pointer-events:none}
#splash .frase{font-style:italic;font-size:16px;line-height:1.45;color:#aeb6c6;max-width:460px;text-align:center}
#splash img{width:104px;height:104px;border-radius:24px;box-shadow:0 10px 36px rgba(0,0,0,.45);animation:splashpulse 1.7s ease-in-out infinite}
#splash .brand{font-size:19px;font-weight:600;letter-spacing:.02em}
#splash .carica{display:flex;gap:6px;margin-top:4px}
#splash .carica i{width:7px;height:7px;border-radius:50%;background:#4d9aff;opacity:.5;animation:splashdot 1.2s ease-in-out infinite}
#splash .carica i:nth-child(2){animation-delay:.2s}
#splash .carica i:nth-child(3){animation-delay:.4s}
@keyframes splashpulse{0%,100%{opacity:.9;transform:scale(1)}50%{opacity:1;transform:scale(1.05)}}
@keyframes splashdot{0%,100%{opacity:.35;transform:translateY(0)}50%{opacity:1;transform:translateY(-4px)}}
</style>
</head>
<body>
<div id="splash">
  <div class="frase">«La crescita deriva da una mancanza»</div>
  <img src="icon-192.png" alt="Metis">
  <div class="brand">Metis Performance</div>
  <div class="carica"><i></i><i></i><i></i></div>
</div>
<script>
/* Frase dello splash: ne pesca una a caso a ogni apertura (per aggiungerne altre, scrivile qui sotto). */
(function () {
  var FRASI = [
    "La crescita deriva da una mancanza",
    "Chi non pianifica è destinato a fallire"
  ];
  try {
    var el = document.querySelector("#splash .frase");
    if (el) el.textContent = "«" + FRASI[Math.floor(Math.random() * FRASI.length)] + "»";
  } catch (e) { /* lascia la frase di default */ }
})();
</script>
<div id="radice"></div>
<div id="velo"></div>
