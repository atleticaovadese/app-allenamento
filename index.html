<style>
/* Splash d'avvio: logo + frase mentre l'app carica, poi sfuma. Inline nell'<head> così appare subito, senza flash. */
#splash{position:fixed;inset:0;z-index:99999;display:flex;flex-direction:column;align-items:center;justify-content:center;background:radial-gradient(1100px 620px at 50% 36%,#1a2332 0%,#121420 52%,#0c0d11 100%);color:#eef2fb;font-family:-apple-system,"Segoe UI",system-ui,Arial,sans-serif;padding:24px;box-sizing:border-box;transition:opacity .5s ease}
#splash.hide{opacity:0;pointer-events:none}
#splash .wrap{display:flex;flex-direction:column;align-items:center;animation:splashin .9s cubic-bezier(.2,.7,.2,1) both}
#splash .logo{position:relative;width:104px;height:104px;display:flex;align-items:center;justify-content:center}
#splash .logo::before{content:"";position:absolute;inset:-28px;border-radius:50%;background:radial-gradient(circle,rgba(77,141,240,.55),rgba(123,192,67,.33) 45%,transparent 70%);filter:blur(15px);animation:splashglow 2.6s ease-in-out infinite}
#splash .logo img{position:relative;width:100px;height:100px;border-radius:24px;border:1px solid rgba(255,255,255,.08);box-shadow:0 14px 40px rgba(0,0,0,.5);animation:splashpulse 2.6s ease-in-out infinite}
#splash .brand{margin-top:22px;font-size:21px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:#eef2fb;background:linear-gradient(90deg,#8fb8ff,#eef2fb 42%,#b7e59a);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
#splash .rule{width:54px;height:3px;margin-top:11px;border-radius:3px;background:linear-gradient(90deg,#4d8df0,#7bc043)}
#splash .frase{margin-top:16px;font-style:italic;font-size:15.5px;line-height:1.5;color:#aeb6c6;max-width:440px;text-align:center;animation:splashin 1.1s .22s cubic-bezier(.2,.7,.2,1) both}
#splash .carica{display:flex;gap:7px;margin-top:24px}
#splash .carica i{width:8px;height:8px;border-radius:50%;background:#4d8df0;animation:splashdot 1.25s ease-in-out infinite}
#splash .carica i:nth-child(2){background:#6aa3cf;animation-delay:.16s}
#splash .carica i:nth-child(3){background:#7bc043;animation-delay:.32s}
@keyframes splashpulse{0%,100%{transform:translateY(0) scale(1)}50%{transform:translateY(-3px) scale(1.035)}}
@keyframes splashglow{0%,100%{opacity:.5;transform:scale(.96)}50%{opacity:.95;transform:scale(1.06)}}
@keyframes splashdot{0%,100%{opacity:.35;transform:translateY(0)}50%{opacity:1;transform:translateY(-5px)}}
@keyframes splashin{0%{opacity:0;transform:translateY(10px)}100%{opacity:1;transform:translateY(0)}}
</style>
</head>
<body>
<div id="splash">
  <div class="wrap">
    <div class="logo"><img src="icon-192.png" alt="Metis"></div>
    <div class="brand">Metis Performance</div>
    <div class="rule"></div>
    <div class="frase">«La crescita deriva da una mancanza»</div>
    <div class="carica"><i></i><i></i><i></i></div>
  </div>
</div>
<script>
/* Frase dello splash: ne pesca una a caso a ogni apertura (per aggiungerne altre, scrivile qui sotto). */
(function () {
  var FRASI = [
    "La crescita deriva da una mancanza",
    "Chi non pianifica è destinato a fallire",
    "Misurare per comprendere, comprendere per migliorare",
    "Chi monitora, progredisce",
    "Ciò che non misuri non migliori"
  ];
  try {
    var el = document.querySelector("#splash .frase");
    if (el) el.textContent = "«" + FRASI[Math.floor(Math.random() * FRASI.length)] + "»";
  } catch (e) { /* lascia la frase di default */ }
})();
</script>
